name: SMARD-, Gas- und CO2-Daten aktualisieren

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "SMARD und EUA-Historie vollständig neu einlesen"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub verwendet UTC. 18:17 UTC entspricht 19:17 MEZ bzw. 20:17 MESZ.
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: marktdaten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: SMARD-Daten herunterladen und zusammenführen
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          SMARD_START_DATE: "2022-01-01"
          SMARD_LOOKBACK_DAYS: "7"
        run: python Scripts/update_smard.py

      - name: TTF-Gas- und EUA-CO2-Daten laden
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          # Nur nach ausdrücklicher EEX-Genehmigung auf true setzen.
          FORCE_EEX_PUBLIC_COMMIT: "false"
        run: python Scripts/update_eex.py

      - name: Änderungen im Repository speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Data download
          if git diff --cached --quiet; then
            echo "Keine versionierbaren Änderungen vorhanden."
          else
            git commit -m "Marktdaten automatisch aktualisiert"
            git push
          fi

      - name: Aktuelle Daten als Workflow-Artefakt bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SMARD-EEX-Daten-aktuell
          path: |
            download/SMARD_Daten_aktuell.zip
            download/EEX_Gas_CO2_aktuell.zip
            download/EEX_Status.json
            _artifacts/EEX_Gas_CO2_aktuell.zip
            _artifacts/EEX_Status.json
          retention-days: 30
          if-no-files-found: warn
